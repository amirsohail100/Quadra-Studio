<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - Quadra</title>
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/firebase-ui.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-theme">

  <!-- Dynamic Background Canvases -->
  <canvas id="bg-canvas"></canvas>
  <canvas id="particle-canvas"></canvas>

  <!-- Navbar -->
  <nav class="navbar fade-in-down">
    <a href="#hero" class="logo brand-logo">
    <svg class="logo-icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="navGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="15" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <linearGradient id="fTopNav" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#0284C7"/></linearGradient>
        <linearGradient id="fRightNav" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#00F2FE"/><stop offset="100%" stop-color="#0072FF"/></linearGradient>
        <linearGradient id="fLeftNav" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#4338CA"/></linearGradient>
        <linearGradient id="fBottomNav" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#A855F7"/><stop offset="100%" stop-color="#6366F1"/></linearGradient>
        <linearGradient id="fGlossNav" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/></linearGradient>
      </defs>
      <g opacity="0.3" filter="url(#navGlowFilter)"><polygon points="256,40 440,146 440,358 256,464 72,358 72,146" fill="#00F2FE"/></g>
      <path d="M 256 60 L 420 154 L 340 200 L 256 150 Z" fill="url(#fTopNav)"/>
      <path d="M 420 154 L 420 346 L 340 300 L 340 200 Z" fill="url(#fRightNav)"/>
      <path d="M 420 154 L 340 200 L 256 150 Z" fill="url(#fGlossNav)"/>
      <path d="M 420 346 L 256 440 L 256 348 L 340 300 Z" fill="url(#fBottomNav)"/>
      <path d="M 420 346 L 340 300 L 256 348 Z" fill="url(#fGlossNav)" opacity="0.4"/>
      <path d="M 256 440 L 92 346 L 172 300 L 256 348 Z" fill="url(#fLeftNav)"/>
      <path d="M 92 346 L 92 154 L 172 200 L 172 300 Z" fill="url(#fBottomNav)" opacity="0.9"/>
      <path d="M 92 154 L 256 60 L 256 150 L 172 200 Z" fill="url(#fTopNav)"/>
      <path d="M 92 154 L 172 200 L 256 150 Z" fill="url(#fGlossNav)" opacity="0.7"/>
      <polygon points="256,150 340,200 340,300 256,348 172,300 172,200" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
    </svg>
    <span>Quadra<span class="logo-dot">.</span></span>
  </a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links nav-collapsible" id="nav-links">
      <li><a href="/index.html" class="nav-item">Home</a></li>
      <li><a href="/index.html#about" class="nav-item">About Us</a></li>
      <li><a href="/index.html#team" class="nav-item">Team</a></li>
      <li><a href="/index.html#services" class="nav-item">Services</a></li>
      <!-- Navigation links ke andar is line ko add karo -->
      <li><a href="projects.html" class="nav-item">Projects</a></li>
      <li><a href="pricing.html" class="nav-item">Pricing</a></li>
      <li><a href="payment.html" class="nav-item">Payment</a></li>
      <li><a href="help.html" class="nav-item">Help</a></li> 
      <li>
        <button id="theme-toggle" class="sky-switch" aria-label="Toggle Theme">
          <span class="sky-bg">
            <span class="celestial-body">
              <span class="sun-glow"></span>
            </span>
            <span class="star star-1"></span>
            <span class="star star-2"></span>
            <span class="star star-3"></span>
            <span class="cloud-puff"></span>
          </span>
        </button>
      </li>
      <li><a href="/pages/join_us.html" class="btn-nav particle-trigger rgb-hover-btn">Join Us</a></li>
    </ul>
  </nav>

  <section class="hero"><div class="hero-content fade-in-up">
    <span class="badge">My Account 👤</span>
    <h1 class="gradient-text animated-main-title">Your Orders</h1>
    <p class="hero-subtext">Track every order and see when it is approved.</p>
  </div></section>
  <section class="fb-wrap">
    <div class="service-card order-card" id="profile"></div>
    <h2 style="margin:1.5rem 0 1rem">Orders</h2>
    <div id="orders"><p class="muted">Loading...</p></div>
  </section>
  <script src="/js/script.js"></script>
  <script type="module" src="/js/firebase/nav-auth.js"></script>
  <script type="module">
    import { watchAuth, logout, friendlyError } from "/js/firebase/auth.js";
    import { getMyOrders } from "/js/firebase/db.js";
    import { esc, fmtDate, STATUS } from "/js/firebase/ui.js";
    watchAuth(async (user) => {
      if (!user) return location.replace("/pages/login.html?redirect=/pages/account.html");
      const p = document.getElementById("profile");
      p.innerHTML = `<div class="profile-row">${user.photoURL ? `<img src="${esc(user.photoURL)}" alt="">` : ""}
        <div><h3>${esc(user.displayName || "Customer")}</h3><div class="muted">${esc(user.email)}</div></div>
        <button class="btn btn-secondary" id="out-btn" style="margin-left:auto">Sign Out</button></div>`;
      document.getElementById("out-btn").onclick = async () => { await logout(); location.href = "/index.html"; };
      const box = document.getElementById("orders");
      try {
        const orders = await getMyOrders(user.uid);
        if (!orders.length) { box.innerHTML = '<p class="muted">No orders yet. <a href="/pages/pricing.html" style="color:var(--accent)">Place your first order</a>.</p>'; return; }
        box.innerHTML = orders.map((o) => {
          const s = STATUS[o.status] || STATUS.pending;
          return `<div class="service-card order-card">
            <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
              <div><span class="muted">Order ID</span> <b>#${esc(o.orderId)}</b></div><span class="pill ${s.cls}">${s.label}</span></div>
            <h3>${esc(o.service)} <span class="muted">· ${esc(o.price)}</span></h3>
            <div class="order-desc">${esc(o.description)}</div>
            <div class="muted">Placed: ${fmtDate(o.createdAt)}</div>
            ${o.adminNote ? `<div class="muted" style="margin-top:6px"><b>Note from Quadra:</b> ${esc(o.adminNote)}</div>` : ""}
            ${o.status === "in_progress" ? '<a class="btn btn-primary" style="margin-top:10px;display:inline-block" href="/pages/payment.html">Go to Payment</a>' : ""}
          </div>`;
        }).join("");
      } catch (e) { box.innerHTML = `<p class="muted">${esc(friendlyError(e))}</p>`; }
    });
  </script>
</body>
</html>
