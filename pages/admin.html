        <linearGradient id="fLeftNav" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#4338CA"/></linearGradient>
        <linearGradient id="fBottomNav" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#A855F7"/><stop offset="100%" stop-color="#6366F1"/></linearGradient>

      </defs>

      <path d="M 256 60 L 420 154 L 340 200 L 256 150 Z" fill="url(#fTopNav)"/>

      <path d="M 420 154 L 340 200 L 256 150 Z" fill="url(#fGlossNav)"/>

      <path d="M 420 346 L 340 300 L 256 348 Z" fill="url(#fGlossNav)" opacity="0.4"/>
      <path d="M 256 440 L 92 346 L 172 300 L 256 348 Z" fill="url(#fLeftNav)"/>
      <path d="M 92 346 L 92 154 L 172 200 L 172 300 Z" fill="url(#fBottomNav)" opacity="0.9"/>
      <path d="M 92 154 L 256 60 L 256 150 L 172 200 Z" fill="url(#fTopNav)"/>
      <path d="M 92 154 L 172 200 L 256 150 Z" fill="url(#fGlossNav)" opacity="0.7"/>
      <polygon points="256,150 340,200 340,300 256,348 172,300 172,200" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
    </svg>

    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">

    <ul class="nav-links nav-collapsible" id="nav-links">
      <li><a href="/index.html" class="nav-item">Home</a></li>
      <li><a href="/index.html#about" class="nav-item">About Us</a></li>
      <li><a href="/index.html#team" class="nav-item">Team</a></li>
      <li><a href="/index.html#services" class="nav-item">Services</a></li>
      <!-- Navigation links ke andar is line ko add karo -->
      <li><a href="projects.html" class="nav-item">Projects</a></li>
      <li><a href="pricing.html" class="nav-item">Pricing</a></li>

      <li><a href="help.html" class="nav-item">Help</a></li> 
      <li>
        <button id="theme-toggle" class="sky-switch" aria-label="Toggle Theme">

  <section class="hero"><div class="hero-content fade-in-up">
    <span class="badge">Owner Panel 🛠️</span>
    <h1 class="gradient-text animated-main-title">Admin Dashboard</h1>
    <p class="hero-subtext">See every order and continue, complete or cancel it.</p>
  </div></section>
  <section class="fb-wrap" id="admin-root"><p class="muted" style="text-align:center">Checking access...</p></section>
  <script src="/js/script.js"></script>
  <script type="module" src="/js/firebase/nav-auth.js"></script>
  <script type="module">
    import { watchAuth, isAdmin } from "/js/firebase/auth.js";
    import { watchAllOrders, setOrderStatus, watchFeedback, watchUsers } from "/js/firebase/db.js";
    import { esc, fmtDate, STATUS, toast } from "/js/firebase/ui.js";
    const root = document.getElementById("admin-root");
    let orders = [], feedback = [], users = [], tab = "orders";
    const fail = (e) => toast(e.code === "permission-denied" ? "Permission denied (are you in the admins collection?)" : e.message, "error");

    watchAuth(async (user) => {
      if (!user) return location.replace("/pages/login.html?redirect=/pages/admin.html");
      if (!(await isAdmin(user.uid))) {
        root.innerHTML = '<div class="service-card denied"><h2>Access denied</h2><p class="muted">This page is only for the site owner.</p></div>';
        return;
      }
      root.innerHTML = `
        <div class="stats-grid" id="stats"></div>
        <div class="admin-tabs">
          <button data-t="orders" class="active">Orders</button>
          <button data-t="feedback">Feedback</button>
          <button data-t="users">Users</button>
        </div>
        <div id="panel"></div>`;
      root.querySelectorAll(".admin-tabs button").forEach((b) => b.onclick = () => {
        tab = b.dataset.t;
        root.querySelectorAll(".admin-tabs button").forEach((x) => x.classList.toggle("active", x === b));
        draw();
      });
      watchAllOrders((o) => { orders = o; draw(); }, fail);
      watchFeedback((f) => { feedback = f; draw(); }, fail);
      watchUsers((u) => { users = u; draw(); }, fail);
    });

    let filter = "all", search = "";
    function stats() {
      const c = (s) => orders.filter((o) => o.status === s).length;
      document.getElementById("stats").innerHTML = [
        ["Total", orders.length], ["Pending", c("pending")], ["In Progress", c("in_progress")],
        ["Completed", c("completed")], ["Cancelled", c("cancelled")], ["Users", users.length],
      ].map(([l, n]) => `<div class="stat-box"><b>${n}</b>${l}</div>`).join("");
    }

    function actions(o) {
      const b = (st, label, cls) => `<button class="adm-btn ${cls}" data-id="${esc(o.orderId)}" data-st="${st}">${label}</button>`;
      if (o.status === "pending") return b("in_progress", "Continue", "go") + b("cancelled", "Cancel", "stop");
      if (o.status === "in_progress") return b("completed", "Complete", "fin") + b("cancelled", "Cancel", "stop");
      if (o.status === "cancelled") return b("pending", "Reopen", "");
      return "—";
    }

    function draw() {
      if (!document.getElementById("panel")) return;
      stats();
      const p = document.getElementById("panel");
      if (tab === "orders") {
        const q = search.toLowerCase();
        const list = orders.filter((o) => (filter === "all" || o.status === filter) &&
          (!q || [o.orderId, o.userName, o.userEmail, o.contactEmail, o.service].join(" ").toLowerCase().includes(q)));
        p.innerHTML = `<div class="admin-tools">
            <select id="f-status"><option value="all">All statuses</option>
              ${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${filter === k ? "selected" : ""}>${v.label}</option>`).join("")}</select>
            <input id="f-search" placeholder="Search id / name / email / service" value="${esc(search)}" style="min-width:260px"></div>
          <div class="tbl-wrap"><table class="adm"><thead><tr><th>Order</th><th>Customer</th><th>Service</th><th>Amount</th><th>Description</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead><tbody>
          ${list.map((o) => { const s = STATUS[o.status] || STATUS.pending; return `<tr>
            <td><b>#${esc(o.orderId)}</b></td>
            <td>${esc(o.userName)}<div class="muted">${esc(o.contactEmail)}</div></td>
            <td>${esc(o.service)}</td><td>${esc(o.price)}</td>
            <td><details><summary>View</summary><div class="order-desc">${esc(o.description)}</div></details>${o.adminNote ? `<div class="muted">Note: ${esc(o.adminNote)}</div>` : ""}</td>
            <td class="muted">${fmtDate(o.createdAt)}</td>
            <td><span class="pill ${s.cls}">${s.label}</span></td>
            <td><div class="row-actions">${actions(o)}</div></td></tr>`; }).join("") || '<tr><td colspan="8" class="muted">No orders found.</td></tr>'}
          </tbody></table></div>`;
        document.getElementById("f-status").onchange = (e) => { filter = e.target.value; draw(); };
        const si = document.getElementById("f-search");
        si.oninput = (e) => { search = e.target.value; draw(); const n = document.getElementById("f-search"); n.focus(); n.setSelectionRange(search.length, search.length); };
        p.querySelectorAll("button[data-id]").forEach((btn) => btn.onclick = async () => {
          const st = btn.dataset.st;
          let note = "";
          if (st === "cancelled") {
            note = prompt("Reason for cancelling (the customer will see this):", "") ;
            if (note === null) return;
          } else if (!confirm(`Mark order #${btn.dataset.id} as "${STATUS[st].label}"?`)) return;
          btn.disabled = true;
          try { await setOrderStatus(btn.dataset.id, st, note); toast(`Order #${btn.dataset.id} → ${STATUS[st].label}`, "success"); }
          catch (e) { fail(e); btn.disabled = false; }
        });
      } else if (tab === "feedback") {
        p.innerHTML = `<div class="tbl-wrap"><table class="adm"><thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Rating</th><th>Topic</th><th>Message</th></tr></thead><tbody>
          ${feedback.map((f) => `<tr><td class="muted">${fmtDate(f.createdAt)}</td><td>${esc(f.name)}</td><td>${esc(f.email)}</td>
            <td>${"★".repeat(f.rating || 0)}${"☆".repeat(5 - (f.rating || 0))}</td><td>${esc(f.category)}</td><td class="order-desc">${esc(f.message)}</td></tr>`).join("") || '<tr><td colspan="6" class="muted">No feedback yet.</td></tr>'}
          </tbody></table></div>`;
      } else {
        p.innerHTML = `<div class="tbl-wrap"><table class="adm"><thead><tr><th>Name</th><th>Email</th><th>Provider</th><th>Joined</th><th>Last login</th></tr></thead><tbody>
          ${users.map((u) => `<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.provider)}</td><td class="muted">${fmtDate(u.createdAt)}</td><td class="muted">${fmtDate(u.lastLoginAt)}</td></tr>`).join("") || '<tr><td colspan="5" class="muted">No users yet.</td></tr>'}
          </tbody></table></div>`;
      }
    }
  </script>
</body>
